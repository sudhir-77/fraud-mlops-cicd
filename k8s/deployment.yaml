apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scorer
  labels:
    app: fraud-scorer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-scorer
  template:
    metadata:
      labels:
        app: fraud-scorer
    spec:
      containers:
        - name: scorer
          image: fraud-scorer:local
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
